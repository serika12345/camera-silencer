plugins {
    id "com.android.application"
}

android {
    namespace "dev.serika.camerasilencer"
    compileSdk 36

    def releaseSigningConfigured = [
            System.getenv("ANDROID_KEYSTORE_PATH"),
            System.getenv("ANDROID_KEYSTORE_PASSWORD"),
            System.getenv("ANDROID_KEY_ALIAS"),
            System.getenv("ANDROID_KEY_PASSWORD")
    ].every { it != null && !it.isBlank() }

    buildFeatures { buildConfig true }
    testBuildType project.findProperty("testBuildType") ?: "debug"

    sourceSets {
        debug.java.srcDir "src/standard/java"
        release.java.srcDir "src/standard/java"
    }

    defaultConfig {
        applicationId "dev.serika.camerasilencer"
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "0.1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    def diagnosticSigningConfigured = ["DIAGNOSTIC_KEYSTORE_PATH", "DIAGNOSTIC_KEYSTORE_PASSWORD",
            "DIAGNOSTIC_KEY_ALIAS", "DIAGNOSTIC_KEY_PASSWORD"].every { System.getenv(it) }
    if (diagnosticSigningConfigured) {
        signingConfigs.create("diagnostic") {
            storeFile file(System.getenv("DIAGNOSTIC_KEYSTORE_PATH"))
            storePassword System.getenv("DIAGNOSTIC_KEYSTORE_PASSWORD")
            keyAlias System.getenv("DIAGNOSTIC_KEY_ALIAS")
            keyPassword System.getenv("DIAGNOSTIC_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildTypes.create("diagnostic") {
        initWith buildTypes.release
        applicationIdSuffix ".diagnostic"
        versionNameSuffix "-diagnostic.1"
        def revision = providers.exec {
            commandLine "git", "describe", "--always", "--dirty"
        }.standardOutput.asText.get().trim()
        buildConfigField "String", "REVISION", "\"${revision}\""
        signingConfig diagnosticSigningConfigured ? signingConfigs.diagnostic : signingConfigs.debug
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

dependencies {
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
